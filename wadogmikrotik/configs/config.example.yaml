# WadoG MikroTik Recovery Service - Configuración de Ejemplo

# Configuración de la antena del Lado A
side_a:
  ip: "192.168.1.1"
  ssh:
    user: "wadogservice"
    password: "your_password_here"
    # Alternativa: usar clave privada SSH
    # private_key: "/path/to/private/key"
    # key_passphrase: "passphrase_if_encrypted"

# Configuración de la antena del Lado B
side_b:
  ip: "192.168.1.2"
  ssh:
    user: "wadogservice"
    password: "your_password_here"
    # Alternativa: usar clave privada SSH
    # private_key: "/path/to/private/key"
    # key_passphrase: "passphrase_if_encrypted"

# Direcciones a las que hacer ping para verificar conectividad a Internet
# Se considera que hay Internet si al menos una responde
internet_targets:
  - "8.8.8.8"           # Google DNS
  - "1.1.1.1"           # Cloudflare DNS
  - "208.67.222.222"    # OpenDNS

# Intervalo de monitoreo (cuánto esperar entre verificaciones de conectividad)
# Formato: número seguido de unidad (s, m, h)
monitor_interval: "5s"

# Tiempo de espera después de una recuperación antes de permitir otra
# Esto previene ciclos infinitos de reinicios
recovery_cooldown: "300s"  # 5 minutos

# Timeout para cada intento de ping
ping_timeout: "5s"

# Número de intentos para cada ping
retry_attempts: 2

# Delay entre intentos de ping fallidos
retry_delay: "2s"

# Configuración de logging
log_file: "logs/wadogmikrotik.log"
log_max_size: 10        # Tamaño máximo en MB antes de rotar
log_max_backups: 5      # Número de archivos de log a mantener
log_max_age: 30         # Días para mantener los archivos de log
